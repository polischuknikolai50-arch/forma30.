<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:dark;--bg:#090e19;--panel:#121c2c;--panel2:#192539;--line:#29374b;--ink:#f1f5fd;--muted:#9babbd;--accent:#a7f075;--accentInk:#102011;--blue:#90baff;--red:#ff9b9b;--radius:19px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top right,#1b2b3f 0,transparent 38%),var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100svh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{max-width:650px;margin:auto;padding:env(safe-area-inset-top) 16px calc(106px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 15px}.eyebrow{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:800}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:-.7px}h2{font-size:20px;letter-spacing:-.4px}h3{font-size:16px}.sub{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin:12px 0;box-shadow:0 12px 28px #0001}.hero{background:linear-gradient(140deg,#203b32 0%,#162335 75%);border-color:#345544;padding:21px}.hero h2{font-size:25px;margin:9px 0}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#283b4a;color:#d0e1f4;font-size:12px;font-weight:700}.pill.green{background:#294735;color:var(--accent)}.pill.orange{background:#493923;color:#ffcf87}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.gap{display:grid;gap:10px}.btn{border:0;border-radius:13px;padding:13px 17px;font-weight:800;background:var(--accent);color:var(--accentInk);min-height:45px}.btn.secondary{background:var(--panel2);border:1px solid #36465d;color:var(--ink)}.btn.ghost{background:transparent;color:var(--blue);padding:8px 4px}.btn.danger{background:#482c34;color:#ffc2c2}.btn:disabled{opacity:.45;cursor:not-allowed}.wide{width:100%}.metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{background:var(--panel2);border-radius:15px;padding:12px}.metric strong{font-size:24px;display:block}.metric small{color:var(--muted);font-size:11px}.bar{height:9px;border-radius:10px;overflow:hidden;background:#334252;margin:13px 0}.bar>div{background:var(--accent);height:100%;transition:width .2s}.tabs{position:fixed;z-index:30;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#101928ed;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.tabs-inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:650px;width:100%;gap:3px}.tab{color:var(--muted);background:transparent;border:0;border-radius:13px;padding:8px 4px;font-weight:700;font-size:11px}.tab .ico{font-size:21px;display:block;padding-bottom:2px}.tab.active{background:#273a34;color:var(--accent)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:23px 1px 9px}.dayitem{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);width:100%;padding:12px;border-radius:15px;color:var(--ink);margin:8px 0}.dayitem.today{border-color:var(--accent)}.daynum{width:40px;height:40px;border-radius:12px;background:#26374b;display:grid;place-items:center;font-weight:900}.dayitem.completed .daynum{background:#294d38;color:var(--accent)}.dayitem small{display:block;color:var(--muted);margin-top:3px}.dayitem .mark{font-size:18px;color:var(--accent)}.muted{color:var(--muted)}.checkrow{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.checkrow:last-child{border-bottom:0}.checkrow input{width:24px;height:24px;accent-color:#a7f075;flex:0 0 24px;margin:0}.checkrow label{flex:1;cursor:pointer}.checkrow small{display:block;color:var(--muted);margin-top:4px}.stepnum{display:grid;place-items:center;background:#2b4050;border-radius:11px;width:33px;height:33px;flex-shrink:0;font-weight:900;color:var(--accent)}.step{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.step p{color:var(--muted);font-size:13px;margin-top:4px}.timer{font-variant-numeric:tabular-nums;text-align:center;font-size:55px;letter-spacing:1px;font-weight:850;margin:12px 0 16px}.timerbuttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.notice{border-left:3px solid #f2bb7d;background:#3b3028;border-radius:9px;padding:11px;color:#fce0b9;font-size:13px;margin:12px 0}.success{color:var(--accent)}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{background:var(--panel2);color:var(--ink);border:1px solid #3e5064;padding:12px;border-radius:11px;width:100%;min-height:45px}.actionrow{display:flex;flex-wrap:wrap;gap:9px}.small{font-size:12px}.divider{border:0;border-top:1px solid var(--line);margin:17px 0}.hide{display:none!important}.foot{font-size:12px;color:var(--muted);margin-top:13px}.weekday{color:var(--muted);font-size:12px}.exercise-count{background:#304536;color:var(--accent);font-weight:750;padding:4px 7px;border-radius:8px;white-space:nowrap;font-size:12px}.finished{opacity:.75}.finished strong{text-decoration:line-through;text-decoration-color:#8ea297}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-block;background:#25374b;padding:6px 9px;border-radius:8px;color:#dce9f9;font-size:12px}.back{background:transparent;color:var(--blue);border:0;padding:8px 0;font-weight:800}.calendar-week{margin-top:18px}.calendar-week h3{margin:0 0 10px}.smallbtn{padding:8px 12px;font-size:13px;min-height:37px}a{color:var(--blue)}@media(max-width:365px){h1{font-size:23px}.hero h2{font-size:22px}.metric{padding:9px}.metric strong{font-size:21px}.shell{padding-left:12px;padding-right:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
<div class="shell"><header class="top"><div><div class="eyebrow">30 дней к привычке</div><h1>Форма 30</h1></div><div class="pill" id="headerDate"></div></header><main id="app"></main></div>
<nav class="tabs" aria-label="Главная навигация"><div class="tabs-inner"><button class="tab active" data-tab="today"><span class="ico">⌂</span>Сегодня</button><button class="tab" data-tab="calendar"><span class="ico">▦</span>План</button><button class="tab" data-tab="stats"><span class="ico">◫</span>Прогресс</button><button class="tab" data-tab="settings"><span class="ico">⚙</span>Настройки</button></div></nav>
<script>
(()=>{'use strict';
const KEY='forma30_tracker_v1';
const types={A:{name:'Зал A · всё тело',short:'Силовая A',icon:'▣',category:'strength',exercise:[['Жим ногами в тренажёре','10 повторений','Умеренная амплитуда; колени направлены как носки.'],['Горизонтальная тяга сидя','12 повторений','Тяни локти назад, не поднимай плечи.'],['Жим от груди в тренажёре','10 повторений','Только если плечи не болят, лёгкий вес.'],['Ягодичный мост','12 повторений','Плавно подними таз без переразгибания спины.'],['Планка','15–25 секунд','Корпус ровный, не задерживай дыхание.']]},B:{name:'Зал B · спина и ноги',short:'Силовая B',icon:'▣',category:'strength',exercise:[['Приседания до скамьи','10 повторений','Сядь и встань медленно, без боли.'],['Тяга верхнего блока','10 повторений','Тяни к верхней части груди, не за голову.'],['Сгибание ног в тренажёре','12 повторений','Без рывков и дискомфорта в коленях.'],['Наружная ротация плеча с резинкой','10 на руку','Локоть у корпуса, очень лёгкое сопротивление; пропусти при боли.'],['«Мёртвый жук»','8 на сторону','Поясница стабильна, двигайся медленно.']]},swim:{name:'Бассейн',short:'Плавание',icon:'≈',category:'cardio'},walk:{name:'Прогулка',short:'Ходьба',icon:'↗',category:'cardio'},run:{name:'Ходьба + лёгкий бег',short:'Кардио',icon:'↗',category:'cardio'},rest:{name:'Восстановление',short:'Отдых',icon:'○',category:'rest'}};
const pattern=['A','walk','swim','rest','B','run','rest'];
const durations=[[30,15,20,5,30,20,0],[30,20,25,5,30,20,0],[35,20,25,5,35,25,0],[35,25,30,5,35,25,0]];
const warmup=[['Быстрая ходьба','3 минуты','Наращивай темп постепенно.'],['Плечи и руки','1,5 минуты','По 10 плавных кругов плечами; маленькие круги руками без боли.'],['Таз и бёдра','1 минута','По 8 небольших кругов тазом и подъёмов коленей.'],['Приседания до стула','1,5 минуты','8–10 раз медленно. При боли в коленях пропусти.'],['Лопатки','1 минута','10 сведений лопаток либо лёгкие разведения резинки.'],['Пробный подход','1–2 минуты','Первое упражнение без веса или с минимальным весом.']];
const todayISO=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const parseISO=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
const addDays=(iso,n)=>{let d=parseISO(iso);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const diffDays=(a,b)=>Math.round((parseISO(a)-parseISO(b))/86400000);
const fmt=(iso,opt={day:'numeric',month:'short'})=>new Intl.DateTimeFormat('ru-RU',opt).format(parseISO(iso));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({start:todayISO(),completed:{},checks:{},history:[],weight:93,height:'',note:'',startedAt:new Date().toISOString()});
let state;try{state={...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=empty()};
let tab='today',selected=null,section='overview',timerSeconds=60,timerRunning=false,timerEnd=0,timerHandle=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Не удалось сохранить. Проверь место в браузере.')}};
const dayData=i=>{let w=Math.floor(i/7), type=pattern[i%7],min=durations[w][i%7];return {i,w,type,min,date:addDays(state.start,i),...types[type]}};
const trueCount=()=>Object.keys(state.completed).filter(k=>state.completed[k]).length;
const dayIndex=()=>diffDays(todayISO(),state.start);
const sessionKey=i=>String(i);
const checked=(i,id)=>!!((state.checks||{})[sessionKey(i)]||{})[id];
const setCheck=(i,id,val)=>{state.checks??={};state.checks[sessionKey(i)]??={};state.checks[sessionKey(i)][id]=val;save();render()};
const runIndex=i=>{selected=i;section='detail';tab='today';stopTimer();render();scrollTo(0,0)};
const viewTab=t=>{tab=t;section='overview';selected=null;stopTimer();render();scrollTo(0,0)};
function timeDetails(d){if(d.type==='run')return d.w===0?'20 мин быстрой ходьбы':d.w===1?'5 мин ходьбы, 5 циклов: 1 мин бега + 2 мин ходьбы':'5 мин ходьбы, 5–6 циклов: 1,5 мин бега + 2 мин ходьбы';if(d.type==='walk')return `${d.min} минут быстрой комфортной ходьбы`;if(d.type==='swim')return `${d.min} минут спокойного плавания с паузами`;if(d.type==='rest')return d.min?'5 минут лёгкой зарядки по самочувствию':'Полноценный отдых — тренировка не обязательна';return 'Разминка 8–10 мин + силовые упражнения + 3 мин спокойной ходьбы'}
function metrics(){const total=trueCount();const idx=dayIndex();const elapsed=Math.max(0,Math.min(28,idx+1));const possible=Array.from({length:28},(_,i)=>i).filter(i=>dayData(i).type!=='rest'&&i<elapsed).length;const actual=Array.from({length:28},(_,i)=>i).filter(i=>state.completed[i]&&dayData(i).type!=='rest').length;return `<div class="metric-row"><div class="metric"><strong>${total}<span class="sub">/28</span></strong><small>Дней отмечено</small></div><div class="metric"><strong>${actual}<span class="sub">/${possible}</span></strong><small>Активных занятий</small></div><div class="metric"><strong>${Math.round(total/28*100)}%</strong><small>План выполнен</small></div></div><div class="bar"><div style="width:${total/28*100}%"></div></div>`}
function overview(){let i=dayIndex(),current=i>=0&&i<28?i:null,d=current!==null?dayData(current):null;return `<div class="card hero"><span class="pill green">${current===null?(i<0?'Старт впереди':'Месяц завершён'):`День ${i+1} из 28`}</span><h2>${d?esc(d.name):i<0?'Подготовься к старту':'Первый месяц пройден'}</h2><p class="sub">${d?esc(timeDetails(d)):i<0?`Начало ${fmt(state.start)}. Можно выбрать другой день в настройках.`:'Просмотри прогресс и продолжай движение.'}</p>${d?`<p style="margin:11px 0 0"><span class="pill ${state.completed[i]?'green':''}">${state.completed[i]?'✓ Выполнено':d.min?`Около ${d.min} минут`:'День восстановления'}</span></p><button class="btn wide" style="margin-top:16px" data-open="${i}">${state.completed[i]?'Открыть выполненный день':'Открыть тренировку →'}</button>`:`<button class="btn wide" style="margin-top:16px" data-tabgo="${i<0?'settings':'stats'}">${i<0?'Настроить дату начала':'Посмотреть результаты'}</button>`}</div><div class="sectionhead"><h2>Прогресс</h2><button class="btn ghost" data-tabgo="stats">Подробнее →</button></div><div class="card">${metrics()}</div><div class="sectionhead"><h2>Ближайшие дни</h2><button class="btn ghost" data-tabgo="calendar">Весь план →</button></div>${Array.from({length:4},(_,j)=>Math.max(0,Math.min(24,i))+j).map(k=>dayItem(k)).join('')}<div class="notice">При сильной, острой или длительной боли тренировки через боль исключи и обратись к врачу или физиотерапевту.</div>`}
function dayItem(i){let d=dayData(i),done=state.completed[i],now=dayIndex()===i;return `<button class="dayitem ${done?'completed':''} ${now?'today':''}" data-open="${i}"><span class="daynum">${done?'✓':i+1}</span><span><strong>${esc(d.name)}</strong><small>${fmt(d.date,{weekday:'short',day:'numeric',month:'short'})} · ${d.min?d.min+' мин':'Отдых'}${now?' · Сегодня':''}</small></span><span class="mark">${done?'✓':'›'}</span></button>`}
function calendar(){return `<h2>План по дням</h2><p class="sub">Начало: ${fmt(state.start,{day:'numeric',month:'long',year:'numeric'})}. Нажми любой день, чтобы открыть его.</p>${Array.from({length:4},(_,w)=>`<section class="calendar-week"><h3>Неделя ${w+1}</h3>${Array.from({length:7},(_,j)=>dayItem(w*7+j)).join('')}</section>`).join('')}<div class="card"><h3>День 29–30</h3><p class="sub" style="margin-top:7px">День 29 — спокойная прогулка 20 минут. День 30 — оценка самочувствия, веса и результатов; без обязательной тренировки.</p></div>`}
function fullSteps(d){let arr=[];if(d.type==='A'||d.type==='B'){warmup.forEach((x,i)=>arr.push({id:'w'+i,name:x[0],dose:x[1],info:x[2],group:'Разминка'}));let sets=d.w===0?1:2;d.exercise.forEach((x,i)=>{for(let k=0;k<sets;k++)arr.push({id:'e'+i+'s'+k,name:x[0],dose:`Подход ${k+1}/${sets} · ${x[1]}`,info:x[2],group:'Основная часть'})});arr.push({id:'cool',name:'Спокойная ходьба',dose:'3 минуты',info:'Плавно снизь темп, восстанови дыхание.',group:'Завершение'});}else if(d.type==='swim'){arr=[{id:'sw0',name:'Разогрев на суше',dose:'3–5 минут',info:'Спокойная ходьба и движения плечами в комфортной амплитуде.',group:'Подготовка'},{id:'sw1',name:'Спокойное плавание',dose:`${d.min} минут`,info:'Плавание с передышками. Исключи стиль, вызывающий боль в плечах.',group:'Основная часть'},{id:'sw2',name:'Замедлись',dose:'2–3 минуты',info:'Спокойное движение в воде и восстановление дыхания.',group:'Завершение'}]}else if(d.type==='rest'){arr=[{id:'rest0',name:d.min?'Лёгкая зарядка':'Восстановление',dose:d.min?'5 минут':'Без тренировки',info:'Сон и отдых важны. Не нужно тренироваться через боль.',group:'Сегодня'}]}else{arr=[{id:'card0',name:'Постепенный разогрев',dose:'3–5 минут',info:'Начни с обычной ходьбы.',group:'Подготовка'},{id:'card1',name:d.type==='run'?'Ходьба / бег':'Быстрая ходьба',dose:timeDetails(d),info:d.type==='run'?'Лёгкий разговорный темп. Если суставы болят, вместо бега выбирай ходьбу.':'Держи темп, при котором можешь говорить.',group:'Основная часть'},{id:'card2',name:'Заминка',dose:'3–5 минут',info:'Снизь темп до спокойной ходьбы.',group:'Завершение'}]}return arr}
function detail(){let d=dayData(selected),steps=fullSteps(d),checks=steps.filter(s=>checked(d.i,s.id)).length,completed=state.completed[d.i];let groups=[...new Set(steps.map(s=>s.group))];return `<button class="back" data-back>← Назад</button><div class="card hero"><div class="row"><span class="pill green">День ${d.i+1} · Неделя ${d.w+1}</span><span class="sub">${fmt(d.date,{day:'numeric',month:'long'})}</span></div><h2>${esc(d.name)}</h2><p class="sub">${esc(timeDetails(d))}</p><div class="bar"><div style="width:${steps.length?checks/steps.length*100:0}%"></div></div><p class="small muted">Отмечено шагов: ${checks} из ${steps.length}</p></div>${d.category==='strength'?`<div class="notice">Неделя 1: по одному подходу. Недели 2–4: по два, если восстанавливаешься хорошо. Лёгкий вес, 3–4 повторения в запасе, отдых 45–75 секунд.</div>`:''}${groups.map(g=>`<div class="sectionhead"><h2>${esc(g)}</h2></div><div class="card" style="margin-top:6px">${steps.filter(s=>s.group===g).map(s=>`<div class="checkrow ${checked(d.i,s.id)?'finished':''}"><input type="checkbox" id="c-${d.i}-${s.id}" data-check="${esc(s.id)}" ${checked(d.i,s.id)?'checked':''}><label for="c-${d.i}-${s.id}"><strong>${esc(s.name)}</strong><span class="exercise-count" style="margin-left:6px">${esc(s.dose)}</span><small>${esc(s.info)}</small></label></div>`).join('')}</div>`).join('')}<div class="card"><h3>Таймер отдыха / упражнения</h3><div class="timer" id="timer-display">${clock(timerSeconds)}</div><div class="timerbuttons"><button class="btn secondary smallbtn" data-timer="30">30 сек.</button><button class="btn secondary smallbtn" data-timer="60">60 сек.</button><button class="btn secondary smallbtn" data-timer="90">90 сек.</button></div><div class="actionrow" style="margin-top:9px"><button class="btn" style="flex:1" data-timer="toggle" id="timer-toggle">${timerRunning?'Пауза':'Старт'}</button><button class="btn secondary" data-timer="reset">Сброс</button></div></div><div class="card"><button class="btn wide ${completed?'secondary':''}" data-finish="${d.i}">${completed?'✓ День выполнен · отменить отметку':'✓ Завершить и сохранить день'}</button><p class="foot">Можно отметить день даже без всех шагов — например, если пришлось сократить тренировку.</p></div>`}
function stats(){let c=trueCount(),days=Array.from({length:28},(_,i)=>dayData(i));let workouts=days.filter(d=>state.completed[d.i]&&d.category==='strength').length,swims=days.filter(d=>state.completed[d.i]&&d.type==='swim').length,mins=days.filter(d=>state.completed[d.i]).reduce((a,d)=>a+d.min,0);return `<h2>Твой прогресс</h2><p class="sub">За первый 28-дневный цикл</p><div class="card">${metrics()}</div><div class="metric-row"><div class="metric"><strong>${workouts}</strong><small>Силовых</small></div><div class="metric"><strong>${swims}</strong><small>Бассейнов</small></div><div class="metric"><strong>${mins}</strong><small>Плановых минут*</small></div></div><p class="foot">*Приблизительная сумма запланированного времени отмеченных дней, не фактическое измерение.</p><div class="card"><h3>Четыре недели</h3>${Array.from({length:4},(_,w)=>{let x=Array.from({length:7},(_,j)=>w*7+j).filter(i=>state.completed[i]).length;return `<div class="row" style="margin-top:14px"><span class="small">Неделя ${w+1}</span><span class="small">${x}/7</span></div><div class="bar" style="margin:7px 0"><div style="width:${x/7*100}%"></div></div>`}).join('')}</div><div class="card"><h3>Замеры</h3><p class="sub" style="margin:7px 0">Вес отслеживай несколько раз в неделю утром. Лучше сравнивать средние значения; размер талии — раз в 2 недели.</p><div class="field"><label for="weight">Текущий вес, кг</label><input id="weight" type="number" inputmode="decimal" min="20" max="400" step="0.1" value="${esc(state.weight??'')}"></div><button class="btn secondary smallbtn" data-saveweight>Сохранить вес</button><div class="field"><label for="notes">Заметка о самочувствии / талии</label><input id="notes" maxlength="200" value="${esc(state.note||'')}" placeholder="Например: талия 94 см, больше энергии"></div><button class="btn secondary smallbtn" data-savenote>Сохранить заметку</button></div><div class="notice">Вес не обязан снижаться каждую неделю. Результат — регулярность, техника, самочувствие и постепенное изменение состава тела.</div>`}
function settings(){return `<h2>Настройки и резервная копия</h2><div class="card"><div class="field"><label for="start">Дата начала 28-дневного плана</label><input id="start" type="date" value="${esc(state.start)}"></div><p class="sub">Если изменишь дату, номера дней сдвинутся, но существующие отметки останутся привязаны к номерам дней.</p><button class="btn" data-savestart>Сохранить дату</button><hr class="divider"><h3>Режим</h3><p class="sub" style="margin-top:7px">Основные занятия — 2 силовые, 1 бассейн и 1 кардио в неделю. Поздно вечером лучше лёгкая активность, если скоро спать. Утренняя дисциплина: 5 минут зарядки после пробуждения.</p></div><div class="card"><h3>Данные хранятся на устройстве</h3><p class="sub" style="margin:8px 0 14px">Сохранение автоматическое в браузере. Удаление данных Safari, приватный режим, открытие по другому адресу или смена телефона могут лишить тебя прогресса. Периодически делай резервную копию.</p><div class="actionrow"><button class="btn secondary" data-export>Скачать копию</button><button class="btn secondary" data-import>Восстановить</button><input id="importfile" type="file" accept="application/json,.json" class="hide"></div><hr class="divider"><button class="btn danger" data-reset>Сбросить весь прогресс</button></div><div class="card"><h3>Как добавить на экран iPhone</h3><p class="sub" style="margin-top:9px">1. Размести папку сайта на HTTPS-хостинге (например, GitHub Pages).</p><p class="sub" style="margin-top:7px">2. Открой ссылку в Safari, нажми «Поделиться» → «На экран Домой» → «Добавить».</p><p class="sub" style="margin-top:7px">3. Открывай приложение с появившейся иконки. Для сохранения прогресса используй всегда один и тот же способ открытия. Если переходишь из Safari в приложение, данные могут храниться раздельно — экспортируй копию и восстанови её.</p></div><div class="foot">План носит ознакомительный характер. При повторяющейся сильной боли нужен очный осмотр.</div>`}
function clock(s){let m=Math.floor(Math.max(0,s)/60),sec=Math.max(0,s)%60;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function stopTimer(){timerRunning=false;if(timerHandle){clearInterval(timerHandle);timerHandle=null}timerSeconds=60}
function updateTimer(){const n=document.getElementById('timer-display');if(n)n.textContent=clock(timerSeconds);let b=document.getElementById('timer-toggle');if(b)b.textContent=timerRunning?'Пауза':'Старт'}
function timerAction(v){if(v==='reset'){stopTimer()}else if(v==='toggle'){if(timerRunning){timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerHandle);timerHandle=null}else{if(timerSeconds<=0)timerSeconds=60;timerRunning=true;timerEnd=Date.now()+timerSeconds*1000;timerHandle=setInterval(()=>{timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateTimer();if(timerSeconds<=0){clearInterval(timerHandle);timerHandle=null;timerRunning=false;updateTimer();if(navigator.vibrate)navigator.vibrate([100,70,100]);}},200)}}else{timerRunning=false;clearInterval(timerHandle);timerHandle=null;timerSeconds=Number(v)}updateTimer()}
function render(){document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));document.getElementById('headerDate').textContent=fmt(todayISO(),{day:'numeric',month:'short'});document.getElementById('app').innerHTML=tab==='today'?(section==='detail'&&selected!==null?detail():overview()):tab==='calendar'?calendar():tab==='stats'?stats():settings();updateTimer()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-tabgo],[data-open],[data-back],[data-finish],[data-timer],[data-savestart],[data-saveweight],[data-savenote],[data-export],[data-import],[data-reset]');if(!b)return;if(b.dataset.tab)viewTab(b.dataset.tab);else if(b.dataset.tabgo)viewTab(b.dataset.tabgo);else if(b.dataset.open!==undefined)runIndex(Number(b.dataset.open));else if(b.hasAttribute('data-back'))viewTab('calendar');else if(b.dataset.finish!==undefined){let i=b.dataset.finish;if(state.completed[i]){if(!confirm('Убрать отметку выполнения этого дня?'))return;delete state.completed[i]}else state.completed[i]=new Date().toISOString();save();render()}else if(b.dataset.timer)timerAction(b.dataset.timer);else if(b.hasAttribute('data-savestart')){let value=document.getElementById('start').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){alert('Укажи правильную дату');return}state.start=value;save();viewTab('today')}else if(b.hasAttribute('data-saveweight')){let n=Number(document.getElementById('weight').value);if(!Number.isFinite(n)||n<20||n>400){alert('Введи корректный вес');return}state.weight=n;state.history??=[];state.history.push({date:todayISO(),weight:n});save();render()}else if(b.hasAttribute('data-savenote')){state.note=document.getElementById('notes').value.slice(0,200);save();render()}else if(b.hasAttribute('data-export')){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`forma30-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(b.hasAttribute('data-import'))document.getElementById('importfile').click();else if(b.hasAttribute('data-reset')){if(confirm('Удалить весь прогресс без возможности восстановления?')){state=empty();save();viewTab('today')}}});
document.addEventListener('change',async e=>{if(e.target.dataset.check!==undefined&&selected!==null){setCheck(selected,e.target.dataset.check,e.target.checked)}if(e.target.id==='importfile'){let f=e.target.files?.[0];if(!f)return;try{if(f.size>500000)throw Error('Слишком большой файл');let obj=JSON.parse(await f.text());if(obj.version!==1||!obj.data||!/^\d{4}-\d{2}-\d{2}$/.test(obj.data.start)||typeof obj.data.completed!=='object'||!obj.data.completed||typeof obj.data.checks!=='object'||!obj.data.checks)throw Error('Неверный формат');if(!confirm('Заменить текущий прогресс данными из резервной копии?'))return;state={...empty(),...obj.data};save();viewTab('today')}catch(er){alert('Не удалось восстановить: '+er.message)}}});
render();if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script></body></html>
